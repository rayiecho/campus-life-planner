<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests - Campus Planner</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #000; background: #fff; }
    h1 { border-bottom: 2px solid #000; padding-bottom: 0.4rem; }
    h2 { font-size: 1.1rem; margin-top: 1.5rem; }
    ul { list-style: none; padding: 0; }
    li { padding: 0.3rem 0.5rem; border-bottom: 1px solid #ddd; font-family: ui-monospace, Consolas, monospace; font-size: 0.9rem; }
    .fail { background: #000; color: #fff; font-weight: bold; }
    #summary { font-weight: bold; font-size: 1.1rem; padding: 0.75rem; border: 2px solid #000; }
  </style>
</head>
<body>
  <main>
    <h1>Validator tests</h1>
    <p id="summary" role="status">Running...</p>
    <div id="results"></div>
  </main>

  <script type="module">
    import { patterns, collapseSpaces, checkTitle, checkDuration, checkDate, checkTag, checkTask } from './scripts/validators.js';
    import { compileRegex, parseQuery, sortTasks } from './scripts/search.js';
    import { computeStats, capStatus, addDays } from './scripts/stats.js';
    import { parseImport, validateSettings, checkRecord } from './scripts/storage.js';
    import { formatDuration } from './scripts/ui.js';

    const results = document.getElementById('results');
    let passed = 0;
    let failed = 0;
    let list;

    function group(name) {
      const h = document.createElement('h2');
      h.textContent = name;
      list = document.createElement('ul');
      results.append(h, list);
    }

    function assert(label, condition) {
      const li = document.createElement('li');
      li.textContent = (condition ? 'PASS  ' : 'FAIL  ') + label;
      if (!condition) li.className = 'fail';
      list.append(li);
      condition ? passed++ : failed++;
    }

    const ok = msg => msg === '';

    group('Title');
    assert('"CS lab report" is valid', ok(checkTitle('CS lab report')));
    assert('" leading space" is rejected', !ok(checkTitle(' leading space')));
    assert('"trailing space " is rejected', !ok(checkTitle('trailing space ')));
    assert('empty title is rejected', !ok(checkTitle('')));
    assert('single character "A" is valid', ok(checkTitle('A')));
    assert('collapseSpaces turns "a   b" into "a b"', collapseSpaces('a   b') === 'a b');

    group('Duplicate words (back-reference)');
    assert('"Read the the notes" is caught', !ok(checkTitle('Read the the notes')));
    assert('"Study Study group" is caught (ignores case)', patterns.duplicateWord.test('Study study group'));
    assert('"the theory" is not caught', ok(checkTitle('Read the theory')));
    assert('"Meeting 14:30" is not caught', ok(checkTitle('Meeting 14:30')));

    group('Duration');
    assert('"90" is valid', ok(checkDuration('90')));
    assert('"45.5" is valid', ok(checkDuration('45.5')));
    assert('"30.25" is valid', ok(checkDuration('30.25')));
    assert('"0.5" is valid', ok(checkDuration('0.5')));
    assert('"012" is rejected (leading zero)', !ok(checkDuration('012')));
    assert('"10.555" is rejected (3 decimals)', !ok(checkDuration('10.555')));
    assert('"-5" is rejected', !ok(checkDuration('-5')));
    assert('"abc" is rejected', !ok(checkDuration('abc')));
    assert('"0" is rejected (must be more than 0)', !ok(checkDuration('0')));

    group('Due date');
    assert('"2026-10-14" is valid', ok(checkDate('2026-10-14')));
    assert('"2028-02-29" is valid (leap year)', ok(checkDate('2028-02-29')));
    assert('"2026-02-29" is rejected (not a leap year)', !ok(checkDate('2026-02-29')));
    assert('"2026-13-01" is rejected (month 13)', !ok(checkDate('2026-13-01')));
    assert('"2026-04-31" is rejected (April has 30 days)', !ok(checkDate('2026-04-31')));
    assert('"14/10/2026" is rejected (wrong format)', !ok(checkDate('14/10/2026')));

    group('Tag');
    assert('"Assignment" is valid', ok(checkTag('Assignment')));
    assert('"Group Project" is valid', ok(checkTag('Group Project')));
    assert('"Part-time" is valid', ok(checkTag('Part-time')));
    assert('"CS101" is rejected (numbers)', !ok(checkTag('CS101')));
    assert('"Two  spaces" is rejected', !ok(checkTag('Two  spaces')));
    assert('"-Club" is rejected (starts with hyphen)', !ok(checkTag('-Club')));

    group('Whole task');
    const good = { title: 'Physics exam', dueDate: '2026-10-20', duration: '120', tag: 'Exam' };
    const bad = { title: ' x', dueDate: '2026-02-30', duration: '01', tag: 'Exam1' };
    assert('valid task has no errors', Object.keys(checkTask(good)).length === 0);
    assert('bad task has 4 errors', Object.keys(checkTask(bad)).length === 4);

    group('Search');
    assert('invalid pattern "(abc" returns no regex and an error', compileRegex('(abc').re === null && compileRegex('(abc').error !== '');
    assert('empty search returns no regex', compileRegex('').re === null);
    assert('"@tag:Exam quiz" splits into tag and pattern', parseQuery('@tag:Exam quiz').tag === 'Exam' && parseQuery('@tag:Exam quiz').pattern === 'quiz');
    const sample = [
      { title: 'b', dueDate: '2026-10-09', duration: 30, tag: 'Exam' },
      { title: 'A', dueDate: '2026-10-02', duration: 120, tag: 'Club' },
      { title: 'c', dueDate: '2026-10-08', duration: 15.5, tag: 'Exam' }
    ];
    assert('sort by title ignores case (A, b, c)', sortTasks(sample, 'title-asc').map(t => t.title).join('') === 'Abc');
    assert('sort by duration longest first', sortTasks(sample, 'duration-desc')[0].duration === 120);

    group('Stats');
    const stats = computeStats(sample, '2026-10-08');
    assert('count is 3', stats.count === 3);
    assert('total is 165.5', stats.total === 165.5);
    assert('top tag is Exam', stats.top.tag === 'Exam' && stats.top.count === 2);
    assert('next 7 days counts today and tomorrow (45.5)', stats.next7 === 45.5);
    assert('chart has 7 days ending today', stats.days.length === 7 && stats.days[6].date === '2026-10-08');
    assert('addDays crosses month end', addDays('2026-10-31', 1) === '2026-11-01');
    assert('100 used of 120 target is under by 20', capStatus(100, 120).over === false && capStatus(100, 120).amount === 20);
    assert('150 used of 120 target is over by 30', capStatus(150, 120).over === true && capStatus(150, 120).amount === 30);
    assert('no target returns null', capStatus(50, 0) === null);

    group('Import and settings');
    const rec = { id: 'task_0001', title: 'Lab', dueDate: '2026-10-14', duration: 90, tag: 'Exam',
                  createdAt: '2026-10-01T08:15:00.000Z', updatedAt: '2026-10-01T08:15:00.000Z' };
    assert('a good record passes', checkRecord(rec) === '');
    assert('duration as text "90" is rejected', checkRecord({ ...rec, duration: '90' }) !== '');
    assert('bad id "abc" is rejected', checkRecord({ ...rec, id: 'abc' }) !== '');
    assert('missing createdAt is rejected', checkRecord({ ...rec, createdAt: undefined }) !== '');
    assert('plain list imports', parseImport(JSON.stringify([rec])).ok);
    assert('export format imports', parseImport(JSON.stringify({ tasks: [rec], settings: { unit: 'hours' } })).settings.unit === 'hours');
    assert('broken JSON is rejected', !parseImport('{"tasks": [').ok);
    assert('duplicate ids are rejected', !parseImport(JSON.stringify([rec, rec])).ok);
    assert('one bad record rejects the whole file', !parseImport(JSON.stringify([rec, { ...rec, id: 'task_0002', dueDate: '2026-02-30' }])).ok);
    assert('object without tasks is rejected', !parseImport('{"hello": 1}').ok);
    assert('bad settings fall back to defaults', validateSettings({ unit: 'days', weeklyCap: -5 }).unit === 'minutes');
    assert('90 minutes shows as 1.5 h', formatDuration(90, 'hours') === '1.5 h');
    assert('45.5 minutes shows as 45.5 min', formatDuration(45.5, 'minutes') === '45.5 min');

    document.getElementById('summary').textContent =
      `${passed} passed, ${failed} failed`;
  </script>
</body>
</html>
